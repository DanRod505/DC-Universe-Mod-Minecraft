modLoader="javafml"
loaderVersion="[1,)"
license="All Rights Reserved"
issueTrackerURL="https://github.com/DanRod505/DC-Universe-Mod-Minecraft/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/DanRod505/DC-Universe-Mod-Minecraft"
authors="${mod_authors}"
description='''Projeto de fã, não comercial: heróis e vilões do Universo DC com transformação, energia e habilidades.
DC Comics e seus personagens são marcas de terceiros.'''

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version},26.3)"
    ordering="NONE"
    side="BOTH"
