# DC Universe: o modpack fixa a versão do Distant Horizons (sem atualizador) e não enche o chat de avisos
# (coletor de lixo, distância de renderização, replay do Flashback).
[common]
	[common.logging]
		[common.logging.warning]
			showGarbageCollectorWarning = false
			showHighVanillaRenderDistanceWarning = false
			showReplayWarningOnStartup = false

[client]
	[client.advanced]
		[client.advanced.autoUpdater]
			enableAutoUpdater = false
