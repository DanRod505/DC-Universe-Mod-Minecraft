<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Planejamento DC Universe Mod</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: cabeçalho com contagem, abas, filtros e grade de fichas de personagem que expandem */
:root {
  --bg: #f3f5f9; --surface: #ffffff; --fg: #141a2b; --muted: #5a6378; --line: #d9dfea;
  --accent: #1d4ed8; --gold: #b7791f;
  --heroi: #1d4ed8; --ajudante: #0f766e; --anti: #7c3aed; --vilao: #c2262d;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1120; --surface: #151c30; --fg: #e8ecf6; --muted: #98a2bb; --line: #26304a;
  --accent: #7aa2ff; --gold: #f2c14e;
  --heroi: #7aa2ff; --ajudante: #4fd1c5; --anti: #b794f6; --vilao: #ff7b7f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1120; --surface: #151c30; --fg: #e8ecf6; --muted: #98a2bb; --line: #26304a;
  --accent: #7aa2ff; --gold: #f2c14e;
  --heroi: #7aa2ff; --ajudante: #4fd1c5; --anti: #b794f6; --vilao: #ff7b7f; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 16px/1.5 var(--body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; }
header { display: grid; gap: 8px; padding-block-end: 16px; border-bottom: 2px solid var(--fg); }
.eyebrow { font: 600 13px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
h1 { font: 700 clamp(34px, 6vw, 56px)/1 var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
.meta { color: var(--muted); margin: 0; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.count { font: 600 14px var(--body); padding: 2px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums; }
.count b { color: var(--c); }
nav { display: flex; gap: 4px; margin-block: 20px 16px; border-bottom: 1px solid var(--line); }
nav button { font: 700 20px var(--display); letter-spacing: .03em; text-transform: uppercase; background: none; border: 0; color: var(--muted); padding: 8px 14px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
nav button[aria-selected="true"] { color: var(--fg); border-color: var(--gold); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.tools input { flex: 1 1 220px; min-width: 0; font: 16px var(--body); padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.chip { font: 600 14px var(--body); padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.toggle { margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 6px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.card .top { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; }
.card h3 { font: 700 23px/1.1 var(--display); margin: 0; letter-spacing: .01em; }
.num { font: 600 13px var(--body); color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--c); white-space: nowrap; }
.exp { margin: 0; font-style: italic; }
.reusa { font-size: 14px; color: var(--muted); margin: 0; }
.reusa b { color: var(--fg); font-weight: 600; }
.supremo { display: grid; gap: 2px; padding: 8px 10px; border-radius: 4px; background: color-mix(in srgb, var(--gold) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--gold) 45%, var(--line)); font-size: 15px; }
.supremo strong { font: 700 19px/1.15 var(--display); letter-spacing: .02em; }
.sup-rot { font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
details summary { cursor: pointer; font-weight: 600; color: var(--accent); font-size: 15px; }
details dl { margin: 8px 0 0; display: grid; gap: 8px; }
dt { font: 600 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
dd { margin: 0; }
dd ul { margin: 2px 0 0; padding-left: 18px; }
.energia { border-left: 3px solid var(--gold); padding-left: 8px; }
.empty { color: var(--muted); padding: 24px 0; }
.md { max-width: 78ch; }
nav { flex-wrap: wrap; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--fg); font-weight: 600; }
.sec { font: 700 28px/1.15 var(--display); margin-block: 32px 4px; }
.tbl { overflow-x: auto; }
table.fichas { border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.fichas th, table.fichas td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: right; }
table.fichas th { position: sticky; top: 0; background: var(--bg); cursor: pointer; user-select: none; font-weight: 600; }
table.fichas th[aria-sort] { color: var(--accent); }
table.fichas td:nth-child(2), table.fichas th:nth-child(2), table.fichas td:last-child { text-align: left; }
table.fichas td:nth-child(2) { font-weight: 600; border-left: 3px solid var(--c); }
table.fichas td:last-child { white-space: normal; min-width: 220px; color: var(--muted); }
.sistema { margin-block: 28px 12px; }
.sistema h2 { font: 700 28px/1.15 var(--display); margin: 0 0 4px; }
.sistema > p { margin: 0 0 12px; max-width: 78ch; color: var(--muted); }
.arma h3 { font: 700 21px/1.1 var(--display); margin: 0; }
.arma ul { margin: 0; padding-left: 18px; }
.receita { display: grid; grid-template-columns: repeat(3, minmax(0, 76px)); gap: 3px; margin-block: 6px; }
.receita span { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; text-align: center; font-size: 10.5px; line-height: 1.15; padding: 3px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); overflow-wrap: anywhere; }
.receita span.n { border-color: var(--gold); font-weight: 600; }
.receita span:empty { opacity: .45; }
.receita-legenda { font-size: 13px; color: var(--muted); margin: 0; }
.transf { display: grid; gap: 2px; font-size: 15px; }
.transf b { font-weight: 600; }
.cat-itens h2 { font: 700 28px/1.15 var(--display); margin: 28px 0 12px; }
.chips-usado { font-size: 13px; color: var(--muted); margin: 0; }
.lista-kv { margin: 0; display: grid; gap: 4px; font-size: 14px; }
.lista-kv b { font-weight: 600; }
.pill { display: inline-block; font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); }
.fases { margin: 0; padding-left: 18px; font-size: 14px; }
.donos { font-size: 14px; color: var(--muted); margin: 0; }
.md h1 { font-size: 40px; margin-block: 8px 12px; }
.md h2 { font: 700 28px/1.15 var(--display); margin-block: 32px 8px; padding-top: 8px; border-top: 1px solid var(--line); }
.md h3 { font: 700 21px var(--display); margin-block: 20px 6px; }
.md .tbl { overflow-x: auto; }
.md table { border-collapse: collapse; font-size: 15px; width: 100%; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--surface); }
.md pre { background: var(--surface); border: 1px solid var(--line); padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
.md code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; }
.md blockquote { margin: 0; padding: 8px 12px; border-left: 3px solid var(--gold); background: var(--surface); }
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">Minecraft Java 26.2 · Forge 65.1.0</span>
    <h1>DC Universe Mod</h1>
    <p class="meta">Planejamento: 100 personagens jogáveis, a experiência de cada um e as habilidades que a entregam.</p>
    <div class="counts" id="counts"></div>
  </header>

  <nav role="tablist">
    <button role="tab" id="tab-personagens" aria-selected="true" data-aba="personagens">Personagens</button>
    <button role="tab" id="tab-fichas" aria-selected="false" data-aba="fichas">Fichas</button>
    <button role="tab" id="tab-armas" aria-selected="false" data-aba="armas">Armas</button>
    <button role="tab" id="tab-itens" aria-selected="false" data-aba="itens">Itens</button>
    <button role="tab" id="tab-mundo" aria-selected="false" data-aba="mundo">Mundo</button>
    <button role="tab" id="tab-planejamento" aria-selected="false" data-aba="planejamento">Planejamento</button>
  </nav>

  <section id="aba-personagens">
    <div class="tools">
      <input id="busca" type="search" placeholder="Buscar personagem, poder ou energia" aria-label="Buscar">
      <div id="filtros" class="tools" style="margin:0"></div>
      <button class="chip toggle" id="expandir" aria-pressed="false">Abrir todas as fichas</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="empty" id="vazio" hidden>Nenhum personagem encontrado.</p>
  </section>

  <section id="aba-fichas" hidden>
    <article class="md" id="balanc"></article>
    <h2 class="sec">Fichas comparativas</h2>
    <p class="meta">Clique no cabeçalho de uma coluna para ordenar.</p>
    <div class="tbl"><table class="fichas" id="tabela-fichas"></table></div>
  </section>

  <section id="aba-armas" hidden>
    <div id="armas"></div>
  </section>

  <section id="aba-itens" hidden>
    <div class="tools">
      <input id="busca-itens" type="search" placeholder="Buscar item, ingrediente ou uso" aria-label="Buscar itens">
    </div>
    <div id="itens"></div>
  </section>

  <section id="aba-mundo" hidden>
    <div class="tools" id="mundo-secoes"></div>
    <p class="meta" id="mundo-regra"></p>
    <div id="mundo"></div>
  </section>

  <section id="aba-planejamento" hidden>
    <article class="md" id="plano"></article>
  </section>
</div>

const PLANO = "# DC Universe Mod: Planejamento\n\n> Documento vivo. Etapa atual: **planejamento inicial** (sem código). Itens marcados com **[DECIDIR]** dependem do autor do mod.\n\n## 1. Visão geral\n\n| Item | Valor |\n|---|---|\n| Minecraft | Java Edition 26.2 |\n| Loader | Forge `forge-26.2-65.1.0-mdk` |\n| Mod ID (proposto) | `dcuniverse` |\n| Pacote Java (proposto) | `com.danrod.dcuniverse` |\n| Entregas | `dcuniverse-<versão>.jar` e perfil `.zip` importável no CurseForge |\n\nConceito: o jogador usa um **item de transformação** (craftável) e vira o personagem: recebe a **skin**, o **traje travado** nos slots de armadura (com bônus), um **medidor de energia** próprio e acesso às **habilidades** (ativas pelo menu radial, passivas pela própria ação).\n\nPrincípio que guia todo o resto: **personagem = dados, sistema = código**. Um personagem novo deve ser, na maior parte dos casos, só um arquivo JSON + texturas + receita, reaproveitando sistemas que já existem.\n\n## 2. Arquitetura\n\n### 2.1 Camadas\n\n```\ncore/          registro de tudo, rede (pacotes), config, utilidades\ncharacter/     definição de personagem (data-driven), estado do jogador, transformação\nsuit/          itens de traje, travamento nos slots, bônus de atributos\nskin/          troca de textura/modelo do jogador transformado\nenergy/        medidor de energia + fontes de recarga plugáveis\nability/       tipos de habilidade (ativas e passivas) + registro\n  active/      ex.: projectile_beam, area_blast, construct, dash, grapple\n  passive/     ex.: flight, glide, fast_swim, super_speed, wall_climb\nclient/        menu radial, HUD de energia, teclas, efeitos visuais\ncontent/       itens de transformação, blocos (ex.: lanterna de energia), receitas\ndatagen/       geração automática de receitas, lang, modelos, tags\n```\n\n### 2.2 Personagem data-driven\n\nCada personagem é um arquivo `data/dcuniverse/dc_characters/<id>.json`, carregado por um registro de dados (reload listener / datapack registry). Exemplo:\n\n```json\n{\n  \"id\": \"dcuniverse:superman\",\n  \"skin\": \"dcuniverse:textures/skin/superman.png\",\n  \"model\": \"default\",\n  \"suit\": {\n    \"head\": null,\n    \"chest\": { \"item\": \"dcuniverse:superman_chest\", \"armor\": 8, \"toughness\": 3 },\n    \"legs\":  { \"item\": \"dcuniverse:superman_legs\",  \"armor\": 6 },\n    \"feet\":  { \"item\": \"dcuniverse:superman_boots\", \"armor\": 3 },\n    \"attributes\": { \"minecraft:attack_damage\": 6.0, \"minecraft:movement_speed\": 0.02 }\n  },\n  \"energy\": {\n    \"max\": 1000,\n    \"recharge\": [\n      { \"type\": \"passive\", \"per_tick\": 0.5 },\n      { \"type\": \"sunlight\", \"per_tick\": 2.0 }\n    ]\n  },\n  \"passives\": [\n    { \"type\": \"flight\", \"params\": { \"speed\": 1.6, \"trail\": \"none\" } },\n    { \"type\": \"fall_immunity\" }\n  ],\n  \"abilities\": [\n    { \"type\": \"projectile_beam\", \"id\": \"heat_vision\", \"cost\": 4, \"cost_mode\": \"per_tick\",\n      \"params\": { \"damage\": 6, \"color\": \"#FF2200\", \"sets_fire\": true } },\n    { \"type\": \"area_cone\", \"id\": \"freeze_breath\", \"cost\": 3, \"cost_mode\": \"per_tick\",\n      \"params\": { \"effect\": \"freeze\", \"color\": \"#BFEFFF\" } }\n  ],\n  \"weaknesses\": [ { \"type\": \"near_item\", \"item\": \"dcuniverse:kryptonite\", \"drain_per_tick\": 5 } ]\n}\n```\n\nO código implementa **tipos** (`flight`, `projectile_beam`, `sunlight`...). O JSON só escolhe tipos e ajusta parâmetros. Isso resolve a reutilização pedida: o voo do Superman e o do Lanterna Verde são o mesmo `flight` com `trail` e velocidade diferentes.\n\n### 2.3 Estado do jogador\n\nUm anexo de dados por jogador (capability/attachment do Forge, sincronizado servidor → cliente) guarda:\n\n- personagem ativo (ou nenhum);\n- energia atual;\n- habilidade selecionada no menu radial e cooldowns;\n- inventário de armadura salvo de antes da transformação.\n\nO servidor é a autoridade (funciona em multiplayer); o cliente só pede ações por pacote e desenha.\n\n### 2.4 Transformação\n\n1. Jogador usa o item de transformação (clique direito, com animação/partículas curtas).\n2. Servidor guarda a armadura atual no estado do jogador e a substitui pelas peças do traje.\n3. Aplica skin, atributos, passivas e inicia o medidor de energia.\n4. **Destransformar**: usar o mesmo item de novo (ou tecla dedicada **[DECIDIR]**). Remove traje, devolve a armadura original, remove bônus.\n\nEventos de borda já previstos: morte (proposta: destransforma e devolve a armadura antes do drop), logout/login (estado persiste), troca de dimensão, `/kill`, comandos de admin `/dcu transform <jogador> <personagem>` para testes.\n\n### 2.5 Traje travado nos slots\n\n- Itens de traje têm um componente `dcuniverse:locked_suit`.\n- Bloqueios: clique no slot de armadura (inventário e criativo), troca rápida por clique direito, dispensers, drop, morte e qualquer caminho que mova o item. Uma checagem por tick corrige qualquer caso que escape (se o item sumiu do slot e o jogador está transformado, recoloca; se aparecer fora do slot, apaga).\n- Itens de traje nunca existem fora de um jogador transformado (não craftáveis, não aparecem no criativo por padrão).\n- Bônus vêm por modificadores de atributo do item + `attributes` do personagem.\n\n### 2.6 Skin\n\n- Ao transformar, o renderizador do jogador troca a textura pela do personagem (evento de renderização do jogador no cliente). Modelo `default` (braços largos) ou `slim`.\n- Elementos fora do formato de skin (capa do Superman/Batman, asas da Mulher-Gavião, anel brilhando) viram **camadas de renderização reutilizáveis** (`cape_layer`, `wings_layer`, `glow_layer`) configuradas no JSON.\n- As peças de armadura do traje são renderizadas invisíveis (a skin já mostra o traje), evitando armadura \"por cima\" da skin.\n\n### 2.7 Energia e recarga\n\nMedidor por personagem (`max` no JSON), exibido no HUD. Fontes de recarga são **tipos plugáveis**, combináveis:\n\n| Tipo | Uso | Exemplo |\n|---|---|---|\n| `passive` | regenera sempre | base de quase todos |\n| `sunlight` | bônus sob o sol (céu visível + dia) | kryptonianos |\n| `block_interact` | recarrega ao interagir com um bloco | Lanterna Verde na Bateria de Energia |\n| `while_moving` | recarrega correndo | Flash (Força de Aceleração) |\n| `item_consume` | consome item | Bane (Veneno), Batman (baterias de equipamento) |\n| `water` | recarrega na água | Aquaman |\n| `weather` / `lightning` | durante tempestade ou atingido por raio | Shazam, Adão Negro |\n| `darkness` | recarrega no escuro | personagens sombrios |\n\nDrenos também são tipos (`near_item` para kriptonita, `in_fire` para Caçador de Marte etc.). Energia zerada: habilidades ativas bloqueadas e passivas que gastam energia (ex.: voo prolongado) se desligam com segurança (sem morrer de queda ao acabar a energia em voo: transição para planar/queda amortecida **[DECIDIR]**).\n\n### 2.8 Menu radial e habilidades ativas\n\n- Tecla configurável (proposta: `R`) segura para abrir o menu radial com as habilidades ativas do personagem; soltar sobre uma fatia seleciona.\n- Tecla de uso (proposta: `V`) dispara a habilidade selecionada. Modos: `instant`, `hold` (canalizada, ex.: visão de calor), `charge` (segura e solta).\n- O menu lê a lista do JSON; ícones em `textures/gui/ability/<id>.png`.\n- Habilidades ativas são **tipos genéricos parametrizados**. Lista inicial de tipos que cobre a maioria dos personagens:\n  - `projectile_beam` (raio contínuo), `projectile` (disparo único: batarangue, flecha, rajada)\n  - `area_blast` / `area_cone` (explosão, sopro congelante, onda sônica)\n  - `dash` / `teleport`\n  - `grapple` (gancho do Batman, laço)\n  - `construct` (construtos do anel: escudo, martelo, ponte; spawn de entidade/bloco temporário)\n  - `buff_self` (invulnerabilidade, fúria, intangibilidade)\n  - `summon` (morcegos, animais do Aquaman)\n\n### 2.9 Habilidades passivas por ação\n\nNão aparecem no menu; ativam pela própria ação do jogador. Sistemas compartilhados:\n\n| Passiva | Gatilho | Personagens |\n|---|---|---|\n| `flight` | pulo duplo no ar ativa/desativa voo; controle com movimento | Superman, Supergirl, Lanterna, Mulher-Maravilha, Shazam |\n| `glide` | segurar pulo caindo | Batman (capa), Mulher-Gavião (variante) |\n| `fast_swim` + respiração | estar na água | Aquaman, Arraia Negra |\n| `super_speed` | correr (sprint) acelera progressivamente | Flash, Reverso, Superman (mais fraco) |\n| `wall_run` / `water_run` | correr contra parede/sobre água em supervelocidade | Flash |\n| `super_jump` | pulo agachado carregado | Hulk-like, Bane |\n| `fall_immunity`, `fire_immunity`, `night_vision` etc. | sempre ativas | vários |\n\nCada passiva tem parâmetros visuais (rastro, partículas, som) além dos de jogabilidade, para reaproveitar o mesmo código com aparência diferente.\n\n### 2.10 Conteúdo por personagem (o que se cria a cada novo)\n\n1. JSON do personagem.\n2. Skin + ícones das habilidades (+ camadas extras, se houver).\n3. Item de transformação + receita.\n4. Itens de traje (podem ser gerados pelo datagen a partir do JSON).\n5. Lang (pt_br e en_us).\n6. **Só se necessário**: um tipo novo de habilidade/recarga em código, que passa a servir para personagens futuros.\n\n### 2.11 Habilidade suprema\n\nCada personagem tem uma habilidade suprema: a mais satisfatória de usar. Ela fica no menu radial como as outras, sem medidor próprio; a diferença é o **custo alto de energia** (proposta: 60–80% do medidor) e um cooldown maior. O estilo é de algo grande e marcante: veículos (Batwing), armaduras e mechas (mecha do Kyle Rayner), construtos complexos (fortaleza do John Stewart), transformações (T-Rex do Mutano), invocações e mudanças no terreno (floresta do Monstro do Pântano).\n\nAs supremas também viram sistemas reutilizáveis, cada uma é um tipo parametrizado no JSON:\n\n| Tipo | Sistema compartilhado |\n|---|---|\n| `veiculo` | entidade pilotável com assentos, armas e modo de voo/terra/água configuráveis |\n| `armadura` | mecha ou traje gigante em que o jogador entra (modelo maior, armas próprias) |\n| `construto` | estrutura ou criatura temporária feita de energia, a partir de modelo ou planta salva |\n| `forma` | transformação em outra criatura/forma com modelo, atributos e ataques próprios |\n| `invocacao` | aliados ou montarias invocados que pertencem ao jogador |\n| `mundo` | estrutura ou mudança de terreno no local (temporária ou permanente) |\n\n### 2.12 Regras de multiplayer\n\n- Servidor autoritativo: toda habilidade é validada e executada no servidor; o cliente só pede e desenha.\n- Tudo que é invocado (veículo, construto, aliado, estrutura) tem **dono**: não ataca o dono nem os aliados dele (mesmo time ou grupo) e some quando o dono destransforma, desconecta ou morre (exceto estruturas marcadas como permanentes).\n- Dano em área afeta mobs; outros jogadores só são atingidos se o PvP estiver ligado no servidor (opção de configuração).\n- Efeitos de tempo (tempo de bala, congelar o tempo) afetam só o próprio jogador e os mobs ao redor, nunca a velocidade do mundo para os outros jogadores.\n- Efeitos globais (mudar clima ou dia/noite) têm configuração própria e ficam desligados por padrão em servidores.\n- Estruturas permanentes respeitam proteção de área (spawn protegido e claims de outros mods).\n- Limite configurável de invocações e veículos ativos por jogador, para proteger o desempenho do servidor.\n\n## 3. Testes e verificadores automáticos\n\n### 3.1 Testes incrementais\n\n- **Unitários (JUnit)** para lógica pura: cálculo de energia/recarga, parser de JSON de personagem, seleção do menu radial.\n- **GameTests do Forge** para comportamento no mundo, agrupados por módulo/feature (`flight`, `suit_lock`, `transform`, `energy.sunlight`...).\n- Cada feature nova vem com **seus** testes. A execução padrão roda apenas os grupos afetados pelos arquivos alterados (mapa `módulo → pasta` em um script; mudança em `core/` roda tudo). Rodada completa só em release.\n- Personagem novo que só usa tipos existentes recebe um teste genérico automático (\"transforma, traje travado, energia sobe/desce, destransforma devolvendo armadura\"), gerado para cada JSON, sem escrever teste manual.\n\n### 3.2 Verificadores (tarefa Gradle `./gradlew dcuVerify`, roda no CI e antes de cada build)\n\n| Verificador | Falha quando |\n|---|---|\n| Receitas duplicadas | duas receitas com mesmo padrão/ingredientes (ou mesma saída por padrões equivalentes, ignorando ordem em shapeless) |\n| Conflito com vanilla | receita do mod colide com uma receita do Minecraft |\n| Schema de personagem | JSON inválido, campo faltando, tipo de habilidade/recarga inexistente |\n| Recursos referenciados | skin, ícone, modelo ou som citado não existe |\n| Traduções | chave presente em `en_us` e ausente em `pt_br` (ou vice-versa), ou item sem nome |\n| IDs | ID duplicado de personagem, habilidade ou item |\n| Item de transformação | personagem sem item ou item sem receita/fonte de obtenção |\n| Teclas | duas ações do mod na mesma tecla padrão |\n\nOs verificadores leem os arquivos gerados pelo datagen, então rodam em segundos, sem abrir o jogo.\n\n## 4. Build e entrega\n\n- **CI (GitHub Actions)**: a cada push roda `dcuVerify`, testes afetados e `build`. Em tag `vX.Y.Z` publica uma Release com os dois arquivos.\n- **`.jar`**: `./gradlew build` → `build/libs/dcuniverse-<versão>.jar`.\n- **Perfil CurseForge `.zip`**: tarefa `./gradlew curseforgeProfile` gera:\n  ```\n  manifest.json      (minecraft 26.2, modLoader forge-65.1.0, nome/versão do perfil)\n  modlist.html\n  overrides/mods/dcuniverse-<versão>.jar\n  overrides/config/... (configs padrão, se houver)\n  ```\n  Dependências publicadas no CurseForge (se usarmos alguma) entram em `files` do manifest por ID de projeto; o próprio mod vai em `overrides/mods` enquanto não estiver publicado. Importação: CurseForge → Minecraft → Criar perfil → Importar → escolher o `.zip`.\n- Versionamento semântico; `CHANGELOG.md` atualizado por release.\n\n## 5. Otimização de processo (e de tokens)\n\n- Reutilizar tipos antes de criar código novo; a tabela de \"reaproveita\" (seção 6) é consultada antes de cada personagem.\n- Datagen para tudo que é repetitivo (receitas, modelos de item, lang base, tags).\n- Testes e verificadores focados no que mudou.\n- Um documento curto por sistema em `docs/sistemas/` (contrato do tipo + parâmetros), para que cada tarefa futura leia só o necessário em vez do código todo.\n- Template de personagem (`docs/TEMPLATE_PERSONAGEM.md`) como checklist de criação.\n\n## 6. Personagens sugeridos (para validar)\n\n> A lista completa dos 100 personagens, com a experiência e as habilidades de cada um, está em [PERSONAGENS.md](PERSONAGENS.md) (gerada de `docs/dados/personagens.json` por `tools/gerar_docs.py`, que também gera a página `docs/site/index.html`). As fases abaixo definem a ordem de implementação.\n\nA ordem prioriza quem testa mais sistemas novos primeiro; os seguintes reaproveitam.\n\n### Fase 1: núcleo (cada um introduz sistemas)\n\n| Personagem | Item de transformação | Energia / recarga | Passivas | Ativas (menu) | Introduz |\n|---|---|---|---|---|---|\n| Superman | Cristal Kryptoniano | passiva + sol; dreno por kriptonita | voo, imunidade a queda | visão de calor, sopro congelante, soco sônico | voo, `sunlight`, `projectile_beam`, `area_cone`, fraqueza |\n| Batman | Cinto de Utilidades | baterias de equipamento (`item_consume`) + passiva lenta | planar (capa), visão noturna | batarangue, gancho, bomba de fumaça | `glide`, `grapple`, `projectile`, camada de capa |\n| Lanterna Verde (Hal Jordan) | Anel de Poder | só recarrega na Bateria de Energia (bloco craftável) | voo (rastro verde) | escudo, martelo, ponte construto, rajada | `construct`, `block_interact`, bloco de recarga |\n| Flash (Barry Allen) | Anel do Flash | recarrega correndo | supervelocidade, corrida em parede/água | intangibilidade, soco relâmpago, tornado | `super_speed`, `while_moving`, `buff_self` |\n| Mulher-Maravilha | Tiara de Themyscira | passiva | voo, força | laço da verdade, bloqueio com braceletes, escudo | `grapple` (reuso), bloqueio de projéteis |\n\n### Fase 2: reaproveitando a fase 1\n\n| Personagem | Reaproveita | Novo |\n|---|---|---|\n| Supergirl | tudo do Superman | só skin/ajustes |\n| Aquaman | — | `fast_swim`, recarga `water`, `summon` (animais marinhos), tridente |\n| Shazam | voo, `area_blast` | recarga `lightning`, item = \"palavra\" (pergaminho) |\n| Mulher-Gavião | voo/planar com camada de asas | maça de Nth (melee especial) |\n| Ciborgue | `projectile_beam` | canhão sônico, scanner |\n| Caçador de Marte | voo, intangibilidade do Flash | dreno `in_fire`, metamorfose (skin alternativa) |\n| Arqueiro Verde | `projectile` | flechas especiais (seleção no radial) |\n\n### Fase 3: vilões (quase só reuso)\n\n| Personagem | Reaproveita |\n|---|---|\n| Flash Reverso | Flash (cor do rastro vermelha) |\n| Sinestro | Lanterna Verde (amarelo, bateria amarela) |\n| Adão Negro | Shazam |\n| Lex Luthor (traje de guerra) | voo + `projectile_beam`; energia por baterias |\n| Bane | `super_jump`, recarga `item_consume` (Veneno) |\n| Coringa / Arlequina | `projectile` (bombas, gás), sem voo |\n| Exterminador | `projectile`, `dash` |\n| Capitão Frio | `area_cone` do Superman (congelante) |\n| Darkseid | voo, `projectile_beam` (Visão Ômega), boss-tier |\n\nMais tarde (sistemas mais complexos): Mutano (transformação em animais), Zatanna (magias por texto), Ravena, Estelar, Lanterna Azul/Vermelha e demais tropas (reuso do Lanterna).\n\n## 7. Roteiro de implementação (próximas etapas)\n\n0. Baixar o MDK `forge-26.2-65.1.0`, confirmar versão do Java exigida e APIs atuais (capabilities/attachments, rede, GameTest, renderização do jogador) e registrar no `docs/sistemas/`. **Os nomes de API citados aqui são de referência e serão conferidos nesse passo.**\n1. Esqueleto do projeto + CI + `dcuVerify` (vazio) + tarefa do perfil `.zip`. Primeira release \"vazia\" para validar a importação no CurseForge.\n2. Núcleo: estado do jogador, transformação, traje travado, skin, energia + HUD.\n3. Menu radial + primeiro tipo ativo; voo como primeira passiva.\n4. Superman completo (valida tudo). Depois Batman, Lanterna, Flash, Mulher-Maravilha.\n5. Fase 2 e 3.\n\n## 8. Decisões pendentes [DECIDIR]\n\n1. Lista e ordem dos personagens (seção 6).\n2. Item de transformação: só craft, ou também achado em estruturas/loot? Craft caro (fim de jogo) ou acessível?\n3. Morte do transformado: destransforma (proposta) ou continua transformado ao renascer?\n4. Um jogador pode ter vários itens e trocar de personagem livremente, ou há cooldown?\n5. Destransformar: usar o item de novo (proposta) ou tecla própria?\n6. Energia zerada em pleno voo: cair amortecido (proposta) ou cair normal?\n7. Texturas/skins: quem produz? (o plano assume arte própria, sem copiar assets oficiais).\n8. Dependências externas (ex.: GeckoLib para animações): proposta é **nenhuma** no início.\n9. Multiplayer: proposta é suportar desde o início (servidor autoritativo).\n10. Mod ID `dcuniverse` e nomes em português no jogo com tradução em inglês: confirmar.\n\n> Observação: DC Comics e seus personagens são marcas de terceiros. O mod deve ser distribuído como projeto de fã, não comercial, com arte original.\n";
const BALANC = "# Balanceamento\n\nEscala de referência para comparar personagens, habilidades e armas. Os números de cada personagem estão em `docs/dados/personagens.json` (campo `ficha`) e na tabela gerada em [FICHAS.md](FICHAS.md). São valores iniciais: o ajuste fino acontece nos testes de jogo, mudando só o JSON.\n\n## Unidades\n\n| Atributo | Unidade | Referência vanilla |\n|---|---|---|\n| Vida | corações (1 coração = 2 de vida) | jogador comum: 10 |\n| Armadura | pontos de armadura | armadura de netherite completa: 20 (máximo do jogo: 30) |\n| Dano | corações por golpe | soco: 0,5 · espada de diamante: 3,5 · espada de netherite: 4 |\n| Energia | pontos | — |\n| Regeneração | pontos de energia por segundo (passiva) | — |\n| Velocidade | blocos por segundo | andando: 4,3 · correndo: 5,6 · nadando: 2–4 · élitro em linha reta: ≈30 |\n\n## Níveis de poder\n\nO nível dá a faixa esperada. O gerador de documentos recusa fichas fora da faixa. O nível mede o corpo a corpo e a resistência; poderes podem valer mais (ex.: Constantine é nível 1, mas seus rituais têm efeito de nível 3).\n\n| Nível | Perfil | Vida | Armadura | Dano base | Exemplos |\n|---|---|---|---|---|---|\n| 1 | Humano treinado (equipamento) | 12–16 | 8–14 | 2–4 | Batman, Arqueiro Verde, Coringa |\n| 2 | Meta-humano | 14–24 | 8–20 | 3–6 | Canário Negro, Átomo, Bane |\n| 3 | Superpoderoso | 18–30 | 10–20 | 3–9 | Flash, Lanternas, Mulher-Gavião |\n| 4 | Força cósmica | 34–40 | 18–24 | 8–12 | Superman, Darkseid, Apocalypse |\n\nPersonagens de nível 1 compensam com equipamento: mais gadgets, armas fortes e utilidade no survival. A diferença entre níveis deve ser sentida no combate corpo a corpo, não na utilidade.\n\n## Dano e custo das habilidades\n\nDano de uma habilidade = **dano base do personagem × multiplicador do tipo**.\n\n| Tipo de habilidade | Multiplicador de dano | Custo de energia | Cooldown |\n|---|---|---|---|\n| Leve (rajada rápida, batarangue) | 0,5× | 5–10 | 0,5–1 s |\n| Média (raio, golpe especial) | 1× | 15–25 | 2–4 s |\n| Pesada (soco carregado, explosão) | 2× | 30–50 | 6–10 s |\n| Área (por alvo atingido) | 0,75× | 25–40 | 5–8 s |\n| Contínua (feixe, sopro) | 0,4× por segundo | 3–6 por segundo | — |\n| Utilidade (sem dano) | — | 10–30 | 3–20 s |\n| **Suprema** | 3× ou efeito equivalente | **60–80% da energia máxima** | 60–180 s |\n\nRegras gerais:\n\n- Efeitos de controle (atordoar, prender, congelar) duram no máximo 4 s em mobs comuns e metade disso em chefes.\n- Nenhuma habilidade causa mais que 25 corações de dano num único golpe, para não apagar chefes (Wither, Dragão) de uma vez.\n- Habilidades que destroem blocos respeitam a dureza: obsidiana, bedrock e blocos de proteção nunca quebram.\n\n## Velocidades e limites de servidor\n\n| Movimento | Faixa | Observação |\n|---|---|---|\n| Corrida comum transformado | 5,6–7,5 | |\n| Supervelocidade (vmax) | 12–50 | velocistas atingem o teto acelerando por alguns segundos |\n| Voo | 10–34 | Superman/Supergirl são os mais rápidos; levitação ≈ 10–12 |\n| Mergulho (alados) | até 40 | só em queda |\n| Nado | 3–18 | atlantes 14–18 |\n| Planar | 8–11 | capas, guarda-chuva, elasticidade |\n\nO servidor tem um teto configurável de velocidade (padrão 40 b/s) para não sobrecarregar o carregamento de chunks. Acima disso, o efeito visual continua, mas o deslocamento real é limitado.\n\n## Armas\n\nAs armas estão em `docs/dados/armas.json`, agrupadas por **sistema** (arremesso com retorno, laço, corpo a corpo, escudo, arco, arma de fogo, feixe, ferramenta). Cada sistema é implementado uma vez e as armas só mudam parâmetros (dano, alcance, cooldown, efeitos). A tabela completa está em [FICHAS.md](FICHAS.md#armas).\n";

: "Troféu", "itens": [], "itens_txt": []}, {"id": "boss_darkseid", "nome": "Darkseid Foi", "condicao": "Derrotar Darkseid.", "recompensa": "Título: Lenda da Liga", "itens": [["selo_liga", 20]], "itens_txt": ["20× Selo da Liga da Justiça"]}, {"id": "todos_bosses", "nome": "Sala de Troféus Completa", "condicao": "Derrotar todos os bosses.", "recompensa": "Título: Imbatível e moldura dourada na Torre", "itens": [], "itens_txt": []}, {"id": "lenda", "nome": "Modo Lenda", "condicao": "Derrotar Darkseid no modo Lenda.", "recompensa": "Título: Mito", "itens": [["equacao_antivida", 1]], "itens_txt": ["1× Fragmento da Equação Anti-Vida"]}, {"id": "aliado_npc", "nome": "Amigos em Toda Parte", "condicao": "Chegar a afinidade 100 com 5 NPCs.", "recompensa": "Título: Querido pelo Povo", "itens": [], "itens_txt": []}, {"id": "cidade_salva", "nome": "Herói da Cidade", "condicao": "Completar 50 Alertas da Liga.", "recompensa": "Estátua do jogador na praça da cidade mais visitada", "itens": [], "itens_txt": []}, {"id": "esquadrao", "nome": "Missão Suicida", "condicao": "Completar 25 contratos de Amanda Waller.", "recompensa": "Título: Descartável", "itens": [], "itens_txt": []}, {"id": "suprema", "nome": "Poder Máximo", "condicao": "Usar a habilidade suprema de 10 personagens diferentes.", "recompensa": "Título: Supremo", "itens": [], "itens_txt": []}, {"id": "time_liga", "nome": "Liga da Justiça Reunida", "condicao": "Multiplayer: 7 jogadores transformados em membros da Liga perto da Torre de Vigilância ao mesmo tempo.", "recompensa": "Foto do grupo em pintura (decoração)", "itens": [], "itens_txt": []}]};
const FICHA_COLS = [["nivel", "Nível"], ["vida", "Vida ♥"], ["armadura", "Armadura"], ["dano", "Dano ♥"], ["energia", "Energia"],
  ["regen", "Regen/s"], ["terra", "Corrida"], ["vmax", "Supervel."], ["voo", "Voo"], ["nado", "Nado"], ["planar", "Planar"]];
const num = v => v == null ? "–" : String(v).replace(".", ",");
const CATS = { heroi: "Heróis", ajudante: "Ajudantes", anti: "Anti-heróis", vilao: "Vilões" };
const TIPOS_SUP = { veiculo: "Veículo", armadura: "Armadura/mecha", construto: "Construto", forma: "Transformação", invocacao: "Invocação", mundo: "Estrutura/terreno" };
const CAT1 = { heroi: "Herói", ajudante: "Ajudante", anti: "Anti-herói", vilao: "Vilão" };
const CAMPOS = [["nat", "Naturais (ativam pela ação)"], ["ativ", "Poderes e combate (menu radial)"],
  ["equip", "Armas, ferramentas e invocações"], ["surv", "Utilidade no survival"]];
const porN = Object.fromEntries(PERSONAGENS.map(p => [p.n, p]));
let filtro = "todos", abertas = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cor = c => `var(--${c})`;

document.getElementById("counts").innerHTML =
  `<span class="count" style="--c:var(--fg)"><b>${PERSONAGENS.length}</b> personagens</span>` +
  Object.entries(CATS).map(([k, v]) =>
    `<span class="count" style="--c:${cor(k)}"><b>${PERSONAGENS.filter(p => p.cat === k).length}</b> ${v}</span>`).join("");

const filtros = document.getElementById("filtros");
filtros.innerHTML = [["todos", "Todos"], ...Object.entries(CATS)].map(([k, v]) =>
  `<button class="chip" data-cat="${k}" aria-pressed="${k === filtro}">${v}</button>`).join("");
filtros.addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  filtro = b.dataset.cat;
  filtros.querySelectorAll("[data-cat]").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});

function stats(f) {
  const itens = [["Nível", f.nivel], ["Vida", f.vida + " ♥"], ["Armadura", f.armadura], ["Dano", f.dano + " ♥"], ["Energia", f.energia],
    ["Corrida", f.terra], ["Supervel.", f.vmax], ["Voo", f.voo], ["Nado", f.nado], ["Planar", f.planar]];
  return itens.filter(([, v]) => v != null).map(([r, v]) => `<span>${r} <b>${num(v)}</b></span>`).join("");
}

function receitaHtml(r) {
  if (r.tipo === "shaped") {
    const g = r.grade.map(l => [...l, ...Array(3 - l.length).fill(null)]);
    while (g.length < 3) g.push([null, null, null]);
    const qtd = r.qtd > 1 ? `<p class="receita-legenda">Rende ${r.qtd}</p>` : "";
    return `<div class="receita">${g.flat().map(c => `<span class="${c && c.startsWith("Núcleo Meta") ? "n" : ""}">${c ? esc(c) : ""}</span>`).join("")}</div>${qtd}`;
  }
  if (r.tipo === "shapeless") return `<p class="receita-legenda">Sem forma: ${r.ingredientes.map(esc).join(", ")}${r.qtd > 1 ? ` (rende ${r.qtd})` : ""}</p>`;
  return `<p class="receita-legenda">Fornalha: ${esc(r.entrada)}</p>`;
}

function ficha(p) {
  const reusa = p.reusa_n ? `<p class="reusa">Reaproveita sistemas de <b>${esc(porN[p.reusa_n].nome)}</b></p>` : "";
  const dl = CAMPOS.map(([k, r]) => `<div><dt>${r}</dt><dd><ul>${p[k].map(i => `<li>${esc(i)}</li>`).join("")}</ul></dd></div>`).join("");
  return `<article class="card" style="--c:${cor(p.cat)}">
    <div class="top"><h3>${esc(p.nome)}</h3><span class="num">#${p.n}</span></div>
    <span class="tag">${CAT1[p.cat]}</span>
    <p class="exp">${esc(p.exp)}</p>${reusa}
    <div class="stats">${stats(p.ficha)}</div>
    <div class="supremo"><span class="sup-rot">Habilidade suprema · ${TIPOS_SUP[p.supremo.tipo]}</span><strong>${esc(p.supremo.nome)}</strong><span>${esc(p.supremo.desc)}</span></div>
    <details${abertas ? " open" : ""}><summary>Habilidades e transformação</summary><dl>
      <div><dt>Item de transformação</dt><dd class="transf"><b>${esc(p.transformacao.nome)}</b><span>${esc(p.transformacao.desc)}</span>${receitaHtml(p.transformacao.receita)}</dd></div>${dl}
      <div class="energia"><dt>Energia</dt><dd>${esc(p.energia)}</dd></div></dl></details>
  </article>`;
}

function render() {
  const q = document.getElementById("busca").value.trim().toLowerCase();
  const lista = PERSONAGENS.filter(p => (filtro === "todos" || p.cat === filtro) &&
    (!q || JSON.stringify(p).toLowerCase().includes(q)));
  document.getElementById("grid").innerHTML = lista.map(ficha).join("");
  document.getElementById("vazio").hidden = lista.length > 0;
}
document.getElementById("busca").addEventListener("input", render);
document.getElementById("expandir").addEventListener("click", e => {
  abertas = !abertas;
  e.target.setAttribute("aria-pressed", abertas);
  e.target.textContent = abertas ? "Fechar todas as fichas" : "Abrir todas as fichas";
  render();
});

function md(id, texto) {
  const el = document.getElementById(id);
  if (el.dataset.ok) return;
  el.innerHTML = window.marked ? marked.parse(texto) : `<pre>${esc(texto)}</pre>`;
  el.querySelectorAll("table").forEach(t => { const d = document.createElement("div"); d.className = "tbl"; t.before(d); d.append(t); });
  el.dataset.ok = 1;
}

let ordem = { col: "n", dir: 1 };
function tabelaFichas() {
  const cab = `<thead><tr><th data-col="n">#</th><th data-col="nome">Personagem</th>${FICHA_COLS.map(([c, r]) =>
    `<th data-col="${c}">${r}</th>`).join("")}<th>Observação</th></tr></thead>`;
  const val = (p, c) => c === "n" ? p.n : c === "nome" ? p.nome : p.ficha[c];
  const lista = [...PERSONAGENS].sort((a, b) => {
    const x = val(a, ordem.col), y = val(b, ordem.col);
    if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * ordem.dir;
  });
  const corpo = lista.map(p => `<tr style="--c:${cor(p.cat)}"><td>${p.n}</td><td>${esc(p.nome)}</td>${FICHA_COLS.map(([c]) =>
    `<td>${num(p.ficha[c])}</td>`).join("")}<td>${esc(p.ficha.obs || "")}</td></tr>`).join("");
  const t = document.getElementById("tabela-fichas");
  t.innerHTML = cab + `<tbody>${corpo}</tbody>`;
  const th = t.querySelector(`[data-col="${ordem.col}"]`); if (th) th.setAttribute("aria-sort", ordem.dir > 0 ? "ascending" : "descending");
}
document.getElementById("tabela-fichas").addEventListener("click", e => {
  const th = e.target.closest("[data-col]"); if (!th) return;
  const col = th.dataset.col;
  ordem = { col, dir: ordem.col === col ? -ordem.dir : (col === "n" || col === "nome" ? 1 : -1) };
  tabelaFichas();
});

function armas() {
  document.getElementById("armas").innerHTML = ARMAS.sistemas.map(s => {
    const lista = ARMAS.armas.filter(a => a.sistema === s.id);
    if (!lista.length) return "";
    return `<section class="sistema"><h2>${esc(s.nome)}</h2><p>${esc(s.desc)}</p><div class="grid">${lista.map(a => `
      <article class="card arma" style="--c:var(--gold)">
        <h3>${esc(a.nome)}</h3>
        <p class="donos">${a.donos.map(n => esc(porN[n].nome)).join(", ")}</p>
        <div class="stats"><span>Dano <b>${num(a.dano)} ♥</b></span><span>Cooldown <b>${num(a.cooldown)} s</b></span><span>Alcance <b>${num(a.alcance)}</b></span></div>
        <ul>${a.mecanica.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
        <p class="reusa"><b>Survival:</b> ${esc(a.survival)}</p>
      </article>`).join("")}</div></section>`;
  }).join("");
}

function itens() {
  const q = document.getElementById("busca-itens").value.trim().toLowerCase();
  const est = `<section class="cat-itens"><h2>Estruturas do mundo</h2><div class="grid">${ITENS.estruturas.map(e =>
    `<article class="card" style="--c:var(--gold)"><h3>${esc(e.nome)}</h3><p class="donos">${esc(e.onde)}</p><p class="reusa">${esc(e.conteudo)}</p></article>`).join("")}</div></section>`;
  const cats = Object.entries(ITENS.categorias).map(([k, titulo]) => {
    const lista = ITENS.itens.filter(i => i.cat === k && (!q || JSON.stringify(i).toLowerCase().includes(q)));
    if (!lista.length) return "";
    return `<section class="cat-itens"><h2>${esc(titulo)}</h2><div class="grid">${lista.map(i => `
      <article class="card" style="--c:var(--accent)">
        <h3>${esc(i.nome)}</h3>
        <p class="exp" style="font-style:normal">${esc(i.uso)}</p>
        ${i.obtencao ? `<p class="reusa"><b>Obtenção:</b> ${esc(i.obtencao)}</p>` : ""}
        ${i.receitas.map(r => (i.receitas.length > 1 ? `<p class="reusa"><b>${esc(r.nome)}</b></p>` : "") + receitaHtml(r)).join("")}
        ${i.usado_em.length ? `<details><summary>Usado em ${i.usado_em.length} receita${i.usado_em.length > 1 ? "s" : ""}</summary><p class="chips-usado">${i.usado_em.map(esc).join(", ")}</p></details>` : ""}
      </article>`).join("")}</div></section>`;
  }).join("");
  document.getElementById("itens").innerHTML = (q ? "" : est) + (cats || `<p class="empty">Nenhum item encontrado.</p>`);
}
document.getElementById("busca-itens").addEventListener("input", itens);

const kv = (rot, v) => v && (!Array.isArray(v) || v.length) ? `<span><b>${rot}:</b> ${esc(Array.isArray(v) ? v.join(", ") : v)}</span>` : "";
const COR_TIPO = { cidade: "var(--heroi)", estrutura: "var(--gold)", base: "var(--ajudante)", dimensao: "var(--anti)", planeta: "var(--vilao)" };
const SECOES = {
  locais: ["Locais", "Locais do mundo: cidades, estruturas, bases, dimensões e planetas, com a forma de chegar a cada um.", () =>
    MUNDO.locais.map(l => `<article class="card" style="--c:${COR_TIPO[l.tipo]}">
      <div class="top"><h3>${esc(l.nome)}</h3><span class="pill">${esc(l.tipo_nome)}</span></div>
      <p class="exp" style="font-style:normal">${esc(l.desc)}</p>
      <div class="lista-kv">${kv("Onde", l.onde)}${kv("Como chegar", l.acesso)}${kv("Pontos de interesse", l.sublocais)}${kv("Facção", l.faccao_nome)}
      ${kv("NPCs", l.npcs)}${kv("Bosses", l.bosses)}${kv("Mobs", l.mobs)}${kv("Personagens ligados", l.personagens_nomes)}</div></article>`)],
  npcs: ["NPCs", "", () => MUNDO.npcs.map(n => `<article class="card" style="--c:var(--ajudante)">
      <h3>${esc(n.nome)}</h3><p class="donos">${esc(n.papel)} · ${esc(n.local_nome)}</p>
      <div class="lista-kv">${kv("Interação", n.interacao)}${kv("Gosta de", n.gosta)}${kv("Como aliado", n.aliado)}${kv("Missões", n.missoes)}${kv("Reage a", n.reage_nomes)}</div></article>`)],
  bosses: ["Bosses", "", () => MUNDO.bosses.map(b => `<article class="card" style="--c:var(--vilao)">
      <div class="top"><h3>${esc(b.nome)}</h3><span class="num">${b.vida} ♥</span></div>
      <p class="donos">${esc(b.local_nome)} · nível ${b.nivel}${b.missao ? " · missão " + esc(b.missao) : ""}</p>
      <p class="reusa">${esc(b.invocacao)}</p>
      <ol class="fases">${b.fases.map(f => `<li>${esc(f)}</li>`).join("")}</ol>
      <div class="lista-kv">${kv("Drops", b.drops_nomes)}${kv("Extra", b.extra)}</div></article>`)],
  missoes: ["Missões", "", () => {
    const grupos = [...MUNDO.atos.map(a => [a.nome, MUNDO.missoes.filter(x => x.tipo === "campanha" && x.ato === a.id)]),
      ["Missões secundárias", MUNDO.missoes.filter(x => x.tipo === "secundaria")], ["Missões repetíveis", MUNDO.missoes.filter(x => x.tipo === "repetivel")]];
    return grupos.map(([titulo, lista]) => `</div><h2 class="sec">${esc(titulo)}</h2><div class="grid">` + lista.map(x => `<article class="card" style="--c:${x.tipo === "campanha" ? "var(--gold)" : "var(--accent)"}">
      <h3>${esc(x.nome)}</h3><p class="donos">${esc(x.npc_nome)} · ${esc(x.local_nome)}</p>
      <ul class="fases">${x.objetivos.map(o => `<li>${esc(o)}</li>`).join("")}</ul>
      <div class="lista-kv">${kv("Boss", x.boss_nome)}${kv("Requer", x.requisitos_nomes)}${kv("Recompensa", x.recompensa_txt)}</div></article>`).join(""));
  }],
  mobs: ["Mobs", "", () => MUNDO.mobs.map(x => `<article class="card" style="--c:${x.cat === "capanga" || x.cat === "criatura" ? "var(--vilao)" : x.cat === "animal" ? "var(--ajudante)" : "var(--heroi)"}">
      <div class="top"><h3>${esc(x.nome)}</h3><span class="pill">${esc(x.cat_nome)}</span></div>
      <p class="exp" style="font-style:normal">${esc(x.comportamento)}</p>
      <div class="lista-kv">${kv("Onde", x.locais_nomes)}${kv("Drops", x.drops_nomes)}</div></article>`)],
  conquistas: ["Conquistas", "", () => MUNDO.conquistas.map(c => `<article class="card" style="--c:var(--gold)">
      <h3>${esc(c.nome)}</h3><p class="exp" style="font-style:normal">${esc(c.condicao)}</p><p class="reusa"><b>Recompensa:</b> ${esc(c.recompensa)}</p></article>`)]
};
const REGRAS = { locais: () => MUNDO.faccoes.map(f => f.nome).join(" · "), npcs: () => MUNDO.relacionamento, bosses: () => MUNDO.regras_bosses,
  missoes: () => MUNDO.regras_missoes, mobs: () => MUNDO.regras_mobs, conquistas: () => MUNDO.regras_conquistas };
let secao = "locais";
const secoesEl = document.getElementById("mundo-secoes");
secoesEl.innerHTML = Object.entries(SECOES).map(([k, [nome]]) => `<button class="chip" data-secao="${k}" aria-pressed="${k === secao}">${nome}</button>`).join("");
secoesEl.addEventListener("click", e => {
  const b = e.target.closest("[data-secao]"); if (!b) return;
  secao = b.dataset.secao;
  secoesEl.querySelectorAll("[data-secao]").forEach(x => x.setAttribute("aria-pressed", x === b));
  mundo();
});
function mundo() {
  const r = SECOES[secao][2]();
  document.getElementById("mundo-regra").textContent = (secao === "locais" ? "Facções: " : "") + REGRAS[secao]();
  document.getElementById("mundo").innerHTML = `<div class="grid">${Array.isArray(r) ? r.join("") : r}</div>`;
}

const ABAS = ["personagens", "fichas", "armas", "itens", "mundo", "planejamento"];
function aba(nome) {
  document.querySelectorAll("[role=tab]").forEach(b => b.setAttribute("aria-selected", b.dataset.aba === nome));
  ABAS.forEach(a => document.getElementById("aba-" + a).hidden = a !== nome);
  if (nome === "planejamento") md("plano", PLANO);
  if (nome === "fichas") md("balanc", BALANC);
}
document.querySelector("nav").addEventListener("click", e => {
  const b = e.target.closest("[data-aba]"); if (b) { aba(b.dataset.aba); history.replaceState(null, "", "#" + b.dataset.aba); }
});

render();
tabelaFichas();
armas();
itens();
mundo();
const inicial = location.hash.slice(1);
if (ABAS.includes(inicial)) aba(inicial);
</script>
