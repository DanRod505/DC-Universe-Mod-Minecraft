// Projeto do mod DC Universe (NeoForge 26.2, ModDevGradle).
plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

def modId = providers.gradleProperty('mod_id').get()
def mcVersion = providers.gradleProperty('minecraft_version').get()
def neoVersion = providers.gradleProperty('neo_version').get()

version = providers.gradleProperty('mod_version').get()
group = providers.gradleProperty('mod_group').get()
base.archivesName = modId

// O Minecraft 26.1+ roda em Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir layout.buildDirectory.dir('generated/provisorio')
}

neoForge {
    version = neoVersion

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
            logLevel = org.slf4j.event.Level.INFO
        }
        client {
            client()
            programArguments.addAll '--username', 'Dev'
            // ./gradlew runClient -PdcuEntrar: entra direto no servidor local (testes com Xvfb).
            if (providers.gradleProperty('dcuEntrar').isPresent()) programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565'
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
        data {
            clientData()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', modId, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources) {
    def props = [
        mod_id: modId,
        mod_name: providers.gradleProperty('mod_name').get(),
        mod_version: version.toString(),
        mod_authors: providers.gradleProperty('mod_authors').get(),
        minecraft_version: mcVersion,
        neo_version: neoVersion,
    ]
    inputs.properties(props)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand(props)
    }
}

// Verificador automático: lang, receitas duplicadas, ids e teclas (tools/verificar_mod.py).
def dcuVerify = tasks.register('dcuVerify', Exec) {
    group = 'verification'
    description = 'Confere os recursos do mod (lang pt_br/en_us, receitas, ids e teclas).'
    inputs.dir('src/main/resources')
    inputs.dir('src/main/java')
    inputs.file('tools/verificar_mod.py')
    inputs.file('docs/dados/skins.json')
    commandLine 'python3', '-I', 'tools/verificar_mod.py', '--raiz', '.'
}
tasks.named('check') { dependsOn dcuVerify }

// Modelos de item e texturas provisórias enquanto a arte não fica pronta (decisão 7).
def recursosProvisorios = tasks.register('recursosProvisorios', Exec) {
    group = 'build'
    inputs.dir('src/main/resources/assets')
    inputs.file('tools/recursos_provisorios.py')
    outputs.dir(layout.buildDirectory.dir('generated/provisorio'))
    commandLine 'python3', '-I', 'tools/recursos_provisorios.py', '--raiz', '.', '--saida', 'build/generated/provisorio'
}
tasks.named('processResources') { dependsOn recursosProvisorios }

// Perfil importável no CurseForge: manifest.json + overrides/mods/<jar> + overrides/server.properties (Mundo DC).
def manifestoDir = layout.buildDirectory.dir('perfil')
def manifesto = tasks.register('manifestoPerfil') {
    def saida = manifestoDir.map { it.file('manifest.json') }
    def versaoMod = version.toString()
    def nome = providers.gradleProperty('mod_name').get()
    def autor = providers.gradleProperty('mod_authors').get()
    inputs.property('versao', versaoMod)
    inputs.property('mc', mcVersion)
    inputs.property('neo', neoVersion)
    outputs.file(saida)
    doLast {
        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            minecraft: [version: mcVersion, modLoaders: [[id: "neoforge-${neoVersion}".toString(), primary: true]]],
            manifestType: 'minecraftModpack',
            manifestVersion: 1,
            name: nome,
            version: versaoMod,
            author: autor,
            files: [],
            overrides: 'overrides',
        ]))
        saida.get().asFile.text = json + '\n'
    }
}

tasks.register('perfilCurseForge', Zip) {
    group = 'build'
    description = 'Gera o perfil .zip para importar no CurseForge.'
    archiveFileName = "DC-Universe-${version}-perfil-curseforge.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(manifesto)
    from(tasks.named('jar')) { into 'overrides/mods' }
    from('src/perfil') { into 'overrides' }
}

tasks.named('assemble') { dependsOn 'perfilCurseForge' }
